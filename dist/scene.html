<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>天气视界 · 3D 城市天气</title>
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/scene.css?v=5" />
</head>
<body class="scene-page">
  <canvas id="gl" class="gl"></canvas>
  <canvas id="wxfx" class="wxfx"></canvas>
  <div class="vignette"></div>
  <div class="top-scrim"></div>

  <header class="hud-head">
    <a class="back" href="select.html">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6">
        <path d="M15 5l-7 7 7 7" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>换城市</span>
    </a>
    <div class="place">
      <div class="place-name" id="cityName">北京</div>
      <div class="place-sub"><span id="landmark">天安门</span><span class="dot">·</span><span id="province">北京市</span></div>
    </div>
    <div class="clock">
      <div class="clock-time" id="clock">--:--:--</div>
      <div class="clock-date" id="clockDate">--</div>
    </div>
  </header>

  <aside class="panel" id="panel">
    <button class="panel-toggle" id="panelToggle" type="button" aria-label="收起或展开天气面板">收起</button>
    <div class="p-now">
      <div class="p-temp"><span id="temp">--</span><i>°</i></div>
      <div class="p-wea">
        <div class="p-icon" id="nowIcon"></div>
        <div>
          <div class="p-wea-text" id="weaText">--</div>
          <div class="p-updated" id="updated">更新于 --:--</div>
        </div>
      </div>
    </div>

    <div class="p-chips">
      <div class="chip"><span>风</span><b id="wind">--</b></div>
      <div class="chip"><span>湿度</span><b id="hum">--</b></div>
      <div class="chip"><span>AQI</span><b id="aqi">--</b></div>
      <div class="chip"><span>气压</span><b id="pres">--</b></div>
    </div>

    <div class="p-tips">
      <div class="tip"><span>穿衣</span><b id="tipCloth">—</b></div>
      <div class="tip"><span>带伞</span><b id="tipUmbrella">—</b></div>
    </div>

    <div class="p-block">
      <div class="p-title">24 小时天气 <span>逐 3 小时</span></div>
      <div class="hours" id="hours"></div>
    </div>

    <div class="p-block">
      <div class="p-title">未来 7 天 <span>最高 / 最低</span></div>
      <div class="days" id="days"></div>
    </div>

    <div class="p-foot">
      <span>数据来源 · 中国天气网</span>
      <span id="srcState">实时</span>
    </div>
  </aside>

  <div class="wxbar" id="wxbar">
    <span class="wxbar-label">天气预览</span>
    <button data-wx="auto" class="on">实时</button>
    <button data-wx="clear">晴</button>
    <button data-wx="cloudy">多云</button>
    <button data-wx="overcast">阴</button>
    <button data-wx="rain">雨</button>
    <button data-wx="thunder">雷雨</button>
    <button data-wx="snow">雪</button>
    <button data-wx="fog">雾</button>
  </div>

  <div class="scene-hint" id="hint">拖动旋转 · 滚轮缩放</div>
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <div>正在获取实时天气…</div>
  </div>

  <script>
window.addEventListener('error', function (e) {
  var l = document.getElementById('loading');
  if (l) l.innerHTML = '<pre style="color:#ff8a8a;font:12px/1.6 monospace;max-width:90%;white-space:pre-wrap;text-align:left">' + (e.message || e.error) + '\n' + (e.filename || '') + ':' + e.lineno + '</pre>';
});
</script>
<script src="js/cities.js"></script>
  <script type="module" src="js/scene.js"></script>
</body>
</html>
