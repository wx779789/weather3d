<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>天气视界 · 正在进入</title>
<meta http-equiv="refresh" content="0;url=dist/index.html" />
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 40%, #16233a 0%, #0a0f18 60%, #05070b 100%);
    color: #dfe8f5; font: 15px/1.7 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { text-align: center; padding: 24px; }
  .mark {
    font-size: 26px; font-weight: 600; letter-spacing: .32em; text-indent: .32em;
    margin-bottom: 10px;
    background: linear-gradient(92deg, #bfe0ff, #7fb4ff 45%, #d9c6ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub { font-size: 13px; color: #7f93ad; letter-spacing: .08em; }
  a { color: #8fc0ff; text-decoration: none; border-bottom: 1px solid rgba(143,192,255,.35); }
  a:hover { border-bottom-color: #8fc0ff; }
  .bar {
    width: 168px; height: 2px; margin: 18px auto 0; border-radius: 2px;
    background: linear-gradient(90deg, transparent, rgba(143,192,255,.75), transparent);
    animation: sweep 1.1s ease-in-out infinite;
  }
  @keyframes sweep { 0%,100% { opacity: .25; transform: scaleX(.6); } 50% { opacity: 1; transform: scaleX(1); } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark">天气视界</div>
    <div class="sub">正在进入 3D 城市天气场景…</div>
    <div class="bar"></div>
    <noscript>
      <p>若未自动跳转，请手动打开 <a href="dist/index.html">dist/index.html</a></p>
    </noscript>
  </div>
  <script>
    // Pages 只能发布仓库根目录或 /docs，站点产物在 dist/，故在此做一次性跳转。
    location.replace('dist/index.html' + location.search + location.hash);
  </script>
</body>
</html>
