<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>京都雪庭 · 雪见私汤</title>
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/world.css" />
</head>
<body class="world-page">
  <canvas id="gl" class="gl"></canvas>

  <header class="w-head">
    <a class="back" href="scene.html" id="backBtn">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M15 5l-7 7 7 7" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>回到城市</span>
    </a>
    <div class="w-title">
      <h1>京都雪庭 · 雪见私汤</h1>
      <p><span id="cityName">京都</span> · 雪见风吕</p>
    </div>
    <button id="soundBtn" class="sound-btn" type="button" aria-label="声音开关">
      <span class="dot"></span><span id="soundText">声音</span>
    </button>
  </header>

  <div class="w-time">
    <div class="presets">
      <button data-t="7">朝雪 07:00</button>
      <button data-t="18">暮色 18:00</button>
      <button data-t="22" class="on">雪夜 22:00</button>
    </div>
    <input id="timeSlider" type="range" min="5" max="24" step="0.1" value="22" />
    <div class="clock" id="clock">22:00</div>
  </div>

  <div class="w-hint">
    <span>点树枝落雪</span><span class="dot"></span>
    <span>点雪地留脚印</span><span class="dot"></span>
    <span>点温泉泡汤</span><span class="dot"></span>
    <span>点暖炉加柴</span>
  </div>

  <button id="exitBath" class="exit-bath hidden" type="button">退出泡汤视角</button>

  <div class="loading" id="loading"><div class="spinner"></div><div>正在生成雪庭…</div></div>

  <script src="js/cities.js"></script>
  <script src="js/audio.js"></script>
  <script type="module" src="js/world.js"></script>
</body>
</html>
