<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>选择城市 · 天气视界</title>
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/select.css" />
</head>
<body class="select-page">
  <div class="sel-bg"></div>
  <canvas id="stage" class="sel-canvas"></canvas>

  <header class="sel-head">
    <a class="back" href="index.html" aria-label="返回封面">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6">
        <path d="M15 5l-7 7 7 7" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>返回</span>
    </a>
    <div class="sel-title">
      <h1>选择一座城市</h1>
      <p>拖动浏览 · 点击地标进入它的天气模型</p>
    </div>
    <div class="sel-right">
      <button id="locateBtn" class="locate-btn" type="button">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="12" cy="10" r="3"/><path d="M12 21s7-6.4 7-11a7 7 0 1 0-14 0c0 4.6 7 11 7 11Z" stroke-linejoin="round"/>
        </svg>
        <span id="locateText">定位我的城市</span>
      </button>
      <div class="sel-count"><span id="idx">01</span> / <span id="total">18</span></div>
    </div>
  </header>

  <div class="sel-caption">
    <div class="cap-name" id="capName">北京</div>
    <div class="cap-sub"><span id="capLandmark">天安门</span><span class="dot">·</span><span id="capProvince">北京市</span></div>
  </div>

  <footer class="sel-foot">
    <div class="hint">
      <span class="kbd">←</span><span class="kbd">→</span> 切换城市
      <span class="sep"></span>
      <span class="kbd">Enter</span> 进入
    </div>
    <div class="sel-legend">地标剪影 · 等距微缩</div>
  </footer>

  <script src="js/cities.js"></script>
  <script src="js/cardart.js"></script>
  <script src="js/select.js"></script>
</body>
</html>
